# CI: the unit tests, and a compile of the three templates.
# Actions are pinned to commit SHAs; the token is read-only.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  latex:
    name: Compile the three templates
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Compile classic CV (pdflatex, resume.cls)
        run: |
          cd templates/cv/classic
          pdflatex -interaction=nonstopmode -halt-on-error template.tex
          test -f template.pdf
      - name: Compile academic CV (pdflatex)
        run: |
          cd templates/cv/academic
          pdflatex -interaction=nonstopmode -halt-on-error template.tex
          test -f template.pdf
      - name: Compile cover letter (pdflatex)
        run: |
          cd templates/cover-letter
          pdflatex -interaction=nonstopmode -halt-on-error template.tex
          test -f template.pdf
      - name: Verify extractable PDF text
        run: |
          python3 tools/verify_pdf.py templates/cv/classic/template.pdf --min-chars 100
          python3 tools/verify_pdf.py templates/cv/academic/template.pdf --min-chars 100
          python3 tools/verify_pdf.py templates/cover-letter/template.pdf --min-chars 100
